# Эксперименты на dev (docs/experiments.md). От базовой точки меняется один параметр за раз;
# выбор делается только по dev. Поиск считается и на test для справки (таблица
# в README), ответы модели на test — один раз, только для выбранного варианта.
#
# Правило выбора, записанное до прогона генерации:
# 1) поиск — по evidence@5 на dev (в промпт идут первые фрагменты); разница в
#    1–2 вопроса из 36 считается шумом, тогда берётся более дешёвый вариант;
# 2) генерация — по числу ответов с ключевым термином (term_hit) на 36 вопросах
#    dev с ответом при не меньше 10 отказах из 12 на вопросах без ответа; при
#    разнице не больше одного вопроса — по ссылкам на фрагмент с ответом
#    (cited_evidence), затем по стоимости (время генерации, токены контекста).

baseline:
  chunk_size: 1000
  overlap: 150
  retriever: e5-small
  rerank: 0          # 0 — без cross-encoder'а, N — переранжировать top-N
  top_k: 5

# Поиск: метрики страниц и доказательств, стоимость индекса и запроса
retrieval:
  chunkings:         # с BM25 и e5-small
    - {chunk_size: 500, overlap: 150}
    - {chunk_size: 1000, overlap: 0}
    - {chunk_size: 1000, overlap: 150}
    - {chunk_size: 1000, overlap: 300}
    - {chunk_size: 1500, overlap: 150}
  # на базовой нарезке дополнительно
  extra_retrievers: [lsa-300, e5-small+rerank20]
  # добавлено после первого прогона: на dev лучшие по evidence@5 изменения —
  # нарезка 1500 и переранжирование; их сочетание проверяется отдельно
  combined:
    - {chunk_size: 1500, overlap: 150, retriever: e5-small+rerank20}

# Генерация (Qwen2.5-1.5B, только dev): каждый вариант меняет один параметр
# базовой точки, кроме последнего — сочетания двух лучших по поиску изменений.
# Лимит контекста 3000 токенов у всех вариантов, чтобы top-8 и крупные
# фрагменты не обрезались лимитом, а различались только параметром.
generation:
  max_context_tokens: 3000
  variants:
    baseline: {}
    top3: {top_k: 3}
    top8: {top_k: 8}
    rerank20: {rerank: 20}
    c1500: {chunk_size: 1500}                  # добавлены после поиска на dev
    c1500_rerank20: {chunk_size: 1500, rerank: 20}
