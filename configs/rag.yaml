# Конфигурация ассистента для `python -m rag`. Параметры выбраны на dev
# (README, раздел «Эксперименты»); эксперименты задают их явно в
# configs/experiments.yaml.

data_dir: data

chunking:
  chunk_size: 1000
  overlap: 150

retriever:
  model: e5-small                  # e5-small | lsa-300 (configs/retrieval.yaml) | bm25
  models_config: configs/retrieval.yaml

reranker:
  model_path: models/reranker
  candidates: 20                   # 0 или null — без переранжирования

generation:
  top_k: 5
  max_context_tokens: 3000         # как в экспериментах; top-5 на dev занимает до 1517
  refusal: strict
  retry_empty: true
  min_retrieval_score: null        # порог по e5 на dev не помог

llm:
  backend: llama_cpp               # llama_cpp | mock (проверка связности, не для оценки)
  model_path: models/qwen/qwen2.5-1.5b-instruct-q4_k_m.gguf
  n_ctx: 4096
  seed: 42

cache:
  llm: true                        # ответы LLM кешируются по sha256 (модель, сообщения, max_tokens)
  dir: data/cache

# Веса: путь и sha256 файла (проверяет `python -m rag check`)
